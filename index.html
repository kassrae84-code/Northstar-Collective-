<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northstar Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #030508;
      --smoke-layer-1: rgba(18, 24, 38, 0.6);
      --smoke-layer-2: rgba(229, 197, 148, 0.03);
      --champagne: #E5C594;
      --champagne-dim: rgba(229, 197, 148, 0.15);
      --coral-glow: rgba(224, 109, 83, 0.12);
      --text-main: #F4F5F7;
      --text-sub: #8C93A3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-void);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Deep Atmospheric Smoke Layers */
    .smoke-atmosphere {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 20%, rgba(15, 22, 36, 0.8) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(30, 20, 25, 0.5) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(229, 197, 148, 0.02) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(40px);
      animation: ambientShift 15s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      100% { transform: scale(1.08) translate(-15px, -10px); opacity: 1; }
    }

    .sanctuary-frame {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 400px;
      padding: 24px;
    }

    /* Immersive Glass Panel */
    .atmospheric-card {
      background: var(--smoke-layer-1);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(229, 197, 148, 0.1);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .atmospheric-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 0%, rgba(229, 197, 148, 0.05), transparent 70%);
      pointer-events: none;
    }

    .sanctuary-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .sanctuary-header h1 {
      color: var(--champagne);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 10px;
      text-shadow: 0 0 20px rgba(229, 197, 148, 0.3);
    }

    .sanctuary-header p {
      color: var(--text-sub);
      font-size: 11px;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    /* Fluid Interactive Selector */
    .realm-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .realm-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .realm-btn.active {
      background: var(--champagne-dim);
      color: var(--champagne);
      box-shadow: 0 0 20px rgba(229, 197, 148, 0.1);
    }

    /* Interactive Elements */
    .interactive-row {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .interactive-row:hover {
      border-color: rgba(229, 197, 148, 0.2);
      background: rgba(0, 0, 0, 0.45);
    }

    .fluid-action-btn {
      width: 100%;
      margin-top: 14px;
      background: linear-gradient(135deg, rgba(229, 197, 148, 0.15), rgba(229, 197, 148, 0.05));
      border: 1px solid rgba(229, 197, 148, 0.3);
      color: var(--champagne);
      padding: 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .fluid-action-btn:hover {
      background: var(--champagne);
      color: var(--bg-void);
      box-shadow: 0 0 25px rgba(229, 197, 148, 0.4);
    }

    .pulsing-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--champagne);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--champagne);
      animation: pulse 2s infinite;
      margin-right: 6px;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px var(--champagne); }
      100% { transform: scale(0.95); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="smoke-atmosphere"></div>

  <div class="sanctuary-frame">
    <div class="atmospheric-card">
      <div class="sanctuary-header">
        <div style="font-size: 24px; color: var(--champagne); filter: drop-shadow(0 0 10px rgba(229,197,148,0.4));">❖</div>
        <h1>Northstar Collective</h1>
        <p>Atmospheric Sanctuary & Micro-Economy</p>
      </div>

      <div class="realm-switcher">
        <button class="realm-btn active" id="r1" onclick="switchRealm('escrow')">Escrow Vault</button>
        <button class="realm-btn" id="r2" onclick="switchRealm('showcase')">Editorial Tiers</button>
      </div>

      <!-- Realm 1: Escrow Vault -->
      <div id="realmEscrow">
        <div class="interactive-row">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span style="font-size: 13px; font-weight: 500;">Lawn Maintenance & Edging</span>
            <span style="color: var(--champagne); font-weight: 600; font-size: 13px;">£12.00</span>
          </div>
          <div style="font-size: 11px; color: var(--text-sub); display: flex; align-items: center;">
            <span class="pulsing-dot"></span><span id="vaultStatus">Secured in Atmospheric Escrow</span>
          </div>
          <button class="fluid-action-btn" id="vaultBtn" onclick="resolveVault()">Release Funds</button>
        </div>
      </div>

      <!-- Realm 2: Showcase Tiers -->
      <div id="realmShowcase" style="display: none;">
        <div class="interactive-row">
          <span style="font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px;">Foundation</span>
          <div style="font-size: 13px; font-weight: 500; margin: 4px 0;">Standard Community Access</div>
          <div style="font-size: 11px; color: var(--text-sub);">Complimentary neighborhood visibility.</div>
        </div>
        <div class="interactive-row" style="border-color: rgba(229, 197, 148, 0.2); background: rgba(229, 197, 148, 0.02);">
          <span style="font-size: 10px; color: var(--champagne); text-transform: uppercase; letter-spacing: 1.5px;">Elevated</span>
          <div style="font-size: 13px; font-weight: 500; color: var(--champagne); margin: 4px 0;">Promoted Boost (£4.99)</div>
          <div style="font-size: 11px; color: var(--text-sub);">Priority atmospheric placement.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchRealm(realm) {
      if(realm === 'escrow') {
        document.getElementById('realmEscrow').style.display = 'block';
        document.getElementById('realmShowcase').style.display = 'none';
        document.getElementById('r1').classList.add('active');
        document.getElementById('r2').classList.remove('active');
      } else {
        document.getElementById('realmEscrow').style.display = 'none';
        document.getElementById('realmShowcase').style.display = 'block';
        document.getElementById('r2').classList.add('active');
        document.getElementById('r1').classList.remove('active');
      }
    }

    function resolveVault() {
      const status = document.getElementById('vaultStatus');
      const btn = document.getElementById('vaultBtn');
      status.innerHTML = "Funds Transferred Successfully ✓";
      status.style.color = "var(--champagne)";
      btn.innerHTML = "Vault Settled";
      btn.style.opacity = "0.5";
      btn.style.pointerEvents = "none";
    }
  </script>
</body>
</html>
